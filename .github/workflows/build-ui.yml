name: build-ui

# web/dist is committed to the repo (see web/README.md) so a server owner
# never needs Node to run this resource. This workflow's only job is
# catching the case where someone edited web/src and forgot to rebuild.
# It rebuilds from source and fails the PR if the committed dist/ differs.
on:
  pull_request:
    paths:
      - 'web/src/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/dist/**'

jobs:
  check-dist-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Fail if dist/ is stale
        run: |
          if ! git diff --quiet -- web/dist; then
            echo "web/dist is out of date with web/src. Run 'npm run build' inside web/ and commit the result." >&2
            git diff --stat -- web/dist
            exit 1
          fi
